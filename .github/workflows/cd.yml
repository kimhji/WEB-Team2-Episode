name: CD

concurrency:
  group: deploy
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [ release ]
    paths:
      - "backend/**"
      - "infra/prod/**"
      - ".github/workflows/cd.yml"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: backend/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build JAR
        run: ./gradlew clean bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        run: |
          # 본인의 GHCR 계정명에 맞게 설정 (kimhji)
          IMAGE=ghcr.io/kimhji/episode-api
          TAG=${GITHUB_SHA::7}

          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --platform linux/arm64 \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            --push .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync infra files to server
        working-directory: .
        run: |
          # Caddyfile 제외, docker-compose.yml 위주로 전송
          rsync -avz --delete \
            --exclude='.env' \
            infra/prod/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /home/${{ secrets.EC2_USER }}/app

            # 새로운 이미지 pull 및 컨테이너 재시작
            docker compose pull
            docker compose up -d
          
            echo "Spring Boot server has been restarted."
          EOF

      - name: Health check
        id: health_check
        run: |
          set -e
          # 도메인이 연결되지 않았다면 EC2_HOST 아이피로 변경 가능
          URL="http://${{ secrets.EC2_HOST }}:8080/actuator/health"

          echo "Checking health at $URL"
          for i in $(seq 1 20); do
            resp="$(curl -sS --max-time 5 -w "\n%{http_code}" "$URL" || true)"
            body="$(echo "$resp" | head -n 1)"
            code="$(echo "$resp" | tail -n 1)"

            echo "try=$i http=$code body=$body"

            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"UP"'; then
              echo "Server is UP"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed"
          exit 1

      - name: Cleanup Images
        if: always()
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # 사용하지 않는 예전 이미지 삭제
            docker image prune -f
          EOF
